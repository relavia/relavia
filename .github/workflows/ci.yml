name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: core (Go build / vet / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # core/go.mod requires Go 1.25.5 (sing-box v1.14.4's floor)
          go-version: "1.25"
      - name: Build
        working-directory: core
        run: go build ./...
      - name: Vet
        working-directory: core
        run: go vet ./...
      - name: Test
        working-directory: core
        run: go test ./...
      - name: Test sing-box adapter (official build tags, loopback handshakes)
        working-directory: core
        run: go test -tags "with_quic with_utls with_wireguard with_gvisor" -timeout 20m ./singbox/

  app:
    name: app (client build / vet / test / i18n / windows cross-build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install Gio Linux build dependencies
        # Gio's Linux desktop backend links Vulkan/X11/Wayland
        # headers; the Windows target below is CGO-free.
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev libx11-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcursor-dev libxfixes-dev \
            libxext-dev libwayland-dev libegl-dev libgles-dev
      - name: Build
        working-directory: app
        run: go build ./...
      - name: Vet
        working-directory: app
        run: go vet ./...
      - name: Vet (Windows target — type-checks the Windows platform files)
        working-directory: app
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: go vet ./...
      - name: Test
        working-directory: app
        # -checklinkname=0: app/libboxbind links libbox, whose
        # internals use //go:linkname into restricted runtime
        # symbols; test binaries do not link without the flag.
        # Upstream's own libbox ldflags carry the same flag
        # (docs/libbox绑定.md §6).
        run: go test -ldflags=-checklinkname=0 ./...
      - name: i18n gate (pack integrity + hardcoded-string scan, Step 9)
        working-directory: app
        run: go run ./tools/i18ncheck
      - name: Cross-build Windows client (official kernel build tags)
        working-directory: app
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: go build -tags "with_quic with_utls with_wireguard with_gvisor" -o dist/relavia.exe ./cmd/relavia
      - name: Upload Windows client artifact
        uses: actions/upload-artifact@v4
        with:
          name: relavia-windows-amd64
          path: app/dist/relavia.exe
          if-no-files-found: error

  openvpn3-android:
    name: openvpn3 (android native library + SWIG bindings, MPL-2.0 side)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Install SWIG 4 + native build tools
        # SWIG is pinned to the 4.2 series by the spike: the
        # generated wrapper is version-sensitive
        # (docs/openvpn3构建尖峰.md §4); ubuntu-latest's apt
        # ships 4.2.x. No LZO anywhere in this build — GPL-2.0-only
        # red line (docs/openvpn3许可证审查.md §3).
        run: |
          sudo apt-get update
          sudo apt-get install -y swig cmake ninja-build
          swig -version | head -2
      - name: Checkout vcpkg (pinned baseline)
        run: |
          git clone https://github.com/microsoft/vcpkg.git /tmp/vcpkg
          git -C /tmp/vcpkg checkout 2024.12.16
          /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Cache vcpkg downloads + installed tree and the pinned openvpn3 checkout
        uses: actions/cache@v4
        with:
          path: |
            /tmp/vcpkg/downloads
            /tmp/vcpkg/installed
            /tmp/ovpn3-work/openvpn3
          key: ovpn3-arm64-${{ hashFiles('android/openvpn3/**') }}-vcpkg2024.12.16
      - name: Build libovpn3android.so + net.openvpn.ovpn3 bindings (arm64-v8a)
        env:
          VCPKG_ROOT: /tmp/vcpkg
          OPENVPN3_WORK: /tmp/ovpn3-work
        run: |
          export ANDROID_NDK_HOME="$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)"
          echo "NDK: $ANDROID_NDK_HOME"
          ./android/openvpn3/build-openvpn3-android.sh arm64-v8a
          ls -la android/app/src/main/jniLibs/arm64-v8a/libovpn3android.so
          ls android/app/src/main/java/net/openvpn/ovpn3/ | wc -l
      - name: Upload OpenVPN 3 android inputs (consumed by the android and repro jobs)
        uses: actions/upload-artifact@v4
        with:
          name: relavia-openvpn3-android-arm64
          # Both paths share the android/app/src/main ancestor,
          # so the artifact restores jniLibs/arm64-v8a/ and
          # java/net/openvpn/ovpn3/ in place when a consumer
          # downloads it into android/app/src/main.
          path: |
            android/app/src/main/jniLibs/arm64-v8a/libovpn3android.so
            android/app/src/main/java/net/openvpn/ovpn3
          if-no-files-found: error

  android:
    name: android (cross-compile gate / libbox AAR / merged APK / gio logic APK)
    needs: openvpn3-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: GOOS=android cross-compile gate (service / i18n / platform / bridge / libboxbind)
        run: ./scripts/build-android.sh check
      - name: Install gomobile (SagerNet fork, version pinned by sing-box v1.14.4's Makefile)
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.13
      - name: libbox binding AAR (gomobile bind, NDK from the runner image)
        run: |
          export ANDROID_NDK_HOME="$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)"
          export PATH="$HOME/go/bin:$PATH"
          ./scripts/build-android.sh bind
      - name: Upload libbox AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: relavia-android-libbox-aar
          path: android/app/libs/libboxbind.aar
          if-no-files-found: error
      - name: OpenVPN 3 inputs — native library + generated bindings (openvpn3-android job)
        # The Kotlin OpenVPN 3 sources reference
        # net.openvpn.ovpn3, a SWIG build product that is
        # git-ignored by design; without these inputs
        # assembleDebug fails on unresolved references — the
        # ovpn3-android branch run 43494569302 failed exactly
        # there. At runtime the bridge registers only when
        # the .so is really in the APK (registerIfAvailable).
        uses: actions/download-artifact@v4
        with:
          name: relavia-openvpn3-android-arm64
          path: android/app/src/main
      - name: Merged APK — Kotlin shell + libbox AAR (Gradle assembleDebug)
        run: ./scripts/build-android.sh shell
      - name: Verify merged APK (native library present, permission set unchanged)
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK"
          unzip -l "$APK" | grep -E 'lib/(arm64-v8a|armeabi-v7a|x86_64)/libgojni\.so'
          # The OpenVPN 3 core must be in the APK (arm64-v8a —
          # the ABI the openvpn3-android job builds); without
          # it Android pool nodes silently stay unconnectable.
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/libovpn3android\.so'
          AAPT2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          PERMS="$("$AAPT2" dump permissions "$APK")"
          echo "$PERMS"
          # Exactly the five android.permission.* uses-permissions the
          # shell declares — no more, no fewer, by name. A raw
          # 'uses-permission:' line count is wrong here: androidx.core
          # defines and self-uses the signature-level app permission
          # org.relavia.client.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION,
          # which aapt2 also prints as a uses-permission line (6 lines
          # total) and false-failed this step in CI run 43378835029.
          test "$(echo "$PERMS" | grep -c "uses-permission: name='android.permission\.")" -eq 5
          for p in INTERNET ACCESS_NETWORK_STATE FOREGROUND_SERVICE FOREGROUND_SERVICE_SPECIAL_USE POST_NOTIFICATIONS; do
            echo "$PERMS" | grep -q "uses-permission: name='android.permission.$p'" || { echo "verify: missing permission $p" >&2; exit 1; }
          done
          # The LAUNCHER must be the product UI (Gio), never the
          # retired Step 10 shell page: a real-device test found
          # the shell page as the only surface while the product
          # UI existed only in the separate gogio logic APK
          # (docs/android产品界面接入.md). Guard the regression
          # at the artifact level.
          "$AAPT2" dump badging "$APK" | grep -q "launchable-activity: name='org.gioui.GioActivity'" || { echo "verify: LAUNCHER is not org.gioui.GioActivity" >&2; "$AAPT2" dump badging "$APK" | grep launchable-activity >&2; exit 1; }
      - name: Upload merged APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: relavia-android-merged-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      # arm64-v8a-only variant of the merged APK (KI-18): with
      # the full CJK font collection bundled per ABI (KI-21) the
      # all-ABI merged APK is ~433 MB — over the delivery
      # channel's limit — while the OpenVPN 3 core exists only
      # for arm64-v8a anyway. Same Gradle build, one property:
      # -PrelaviaAbis lands in ndk.abiFilters and AGP drops the
      # other ABIs' native libraries at packaging time (see
      # android/app/build.gradle.kts). The all-ABI artifact
      # above stays the default product, built and verified
      # exactly as before; this variant is uploaded under its
      # own name. The rebuild overwrites app-debug.apk, so the
      # full size is recorded first and the variant is staged
      # under a distinct file name.
      - name: Merged APK, arm64-v8a only (-PrelaviaAbis=arm64-v8a)
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          stat -c%s "$APK" > /tmp/relavia-full-apk-bytes
          RELAVIA_ABIS=arm64-v8a ./scripts/build-android.sh shell
          cp "$APK" android/app/build/outputs/apk/debug/app-debug-arm64-v8a.apk
      - name: Verify merged APK, arm64-v8a only (same gates as the all-ABI artifact + size)
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug-arm64-v8a.apk
          unzip -l "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libgojni\.so' || { echo "verify: arm64-v8a libgojni.so missing" >&2; exit 1; }
          # The ABI filter must really have dropped the rest.
          if unzip -l "$APK" | grep -E 'lib/(armeabi-v7a|x86_64|x86)/'; then
            echo "verify: non-arm64 native libraries survived the ABI filter" >&2; exit 1
          fi
          # Same OpenVPN 3 presence gate as the main artifact.
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/libovpn3android\.so'
          AAPT2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          # Same LAUNCHER gate as the main artifact.
          "$AAPT2" dump badging "$APK" | grep -q "launchable-activity: name='org.gioui.GioActivity'" || { echo "verify: LAUNCHER is not org.gioui.GioActivity" >&2; "$AAPT2" dump badging "$APK" | grep launchable-activity >&2; exit 1; }
          # Dropping three of four ~105 MB libgojni.so copies
          # must land well under the all-ABI size; 60% is the
          # hard ceiling (expected: ~30%).
          FULL_BYTES="$(cat /tmp/relavia-full-apk-bytes)"
          ARM_BYTES="$(stat -c%s "$APK")"
          echo "all-ABI merged APK: $FULL_BYTES bytes; arm64-v8a only: $ARM_BYTES bytes"
          test "$ARM_BYTES" -lt $((FULL_BYTES * 60 / 100)) || { echo "verify: arm64-v8a APK is not <60% of the all-ABI APK" >&2; exit 1; }
      - name: Upload merged APK artifact (arm64-v8a only)
        uses: actions/upload-artifact@v4
        with:
          name: relavia-android-merged-debug-arm64
          path: android/app/build/outputs/apk/debug/app-debug-arm64-v8a.apk
          if-no-files-found: error
      - name: Install gogio
        run: go install gioui.org/cmd/gogio@v0.10.3
      - name: Gio logic-build APK (gogio, NDK from the runner image)
        run: |
          export ANDROID_NDK_HOME="$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)"
          export PATH="$HOME/go/bin:$PATH"
          ./scripts/build-android.sh gio
      - name: Upload Gio logic APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: relavia-android-logic
          path: app/dist/relavia-logic.apk
          if-no-files-found: error

  repro:
    name: repro (release tooling + reproducible builds, Step 15)
    needs: openvpn3-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Release tool (build / vet / test)
        working-directory: tools/releasetool
        run: |
          go build ./...
          go vet ./...
          go test ./...
      - name: Install gomobile + gogio (versions pinned by the build scripts)
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.13
          go install gioui.org/cmd/gogio@v0.10.3
      - name: libbox AAR (shared input for the shell reproducibility check)
        run: |
          export ANDROID_NDK_HOME="$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)"
          export PATH="$HOME/go/bin:$PATH"
          ./scripts/build-android.sh bind
      - name: OpenVPN 3 inputs — native library + generated bindings (openvpn3-android job)
        # Shared inputs for the shell reproducibility check,
        # which injects them into both exported trees exactly
        # like the libbox AAR (scripts/release/repro-check.sh).
        uses: actions/download-artifact@v4
        with:
          name: relavia-openvpn3-android-arm64
          path: android/app/src/main
      - name: Reproducibility — windows (hard gate)
        run: ./scripts/release/repro-check.sh windows --report repro-windows.txt
      # shell/gio run evidence-first (continue-on-error): their
      # byte-reproducibility under Gradle/gogio+NDK has no CI track
      # record yet. The reports are uploaded either way; promote a
      # target to a hard gate only once it is green on evidence
      # (docs/step15-签名与可复现构建.md).
      - name: Reproducibility — android shell APK (evidence; not yet a gate)
        continue-on-error: true
        run: ./scripts/release/repro-check.sh shell --report repro-shell.txt
      - name: Reproducibility — gio logic APK (evidence; not yet a gate)
        continue-on-error: true
        run: |
          export ANDROID_NDK_HOME="$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)"
          export PATH="$HOME/go/bin:$PATH"
          ./scripts/release/repro-check.sh gio --report repro-gio.txt
      - name: Upload reproducibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relavia-repro-reports
          path: repro-*.txt
          if-no-files-found: warn

  plugins:
    name: plugins (source plugins build / vet / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build / vet / test (vpngate, Step 14)
        working-directory: plugins/vpngate
        run: |
          go build ./...
          go vet ./...
          go test ./...

  spec:
    name: spec (unified node model schema validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install jsonschema
        run: pip install "jsonschema>=4"
      - name: Validate schema and examples
        run: python3 spec/tests/validate.py

  openvpn-rig:
    name: openvpn (process adapter real-handshake rig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install OpenVPN (official distro package)
        run: |
          sudo apt-get update
          sudo apt-get install -y openvpn
          openvpn --version
      - name: Handshake rig (real server, TCP loopback, null device)
        working-directory: core
        env:
          RELAVIA_OPENVPN_RIG: "1"
        run: go test -run Rig -v -timeout 10m ./openvpn/
