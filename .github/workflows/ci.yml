name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: core (Go build / vet / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # core/go.mod requires Go 1.25.5 (sing-box v1.14.4's floor)
          go-version: "1.25"
      - name: Build
        working-directory: core
        run: go build ./...
      - name: Vet
        working-directory: core
        run: go vet ./...
      - name: Test
        working-directory: core
        run: go test ./...
      - name: Test sing-box adapter (official build tags, loopback handshakes)
        working-directory: core
        run: go test -tags "with_quic with_utls with_wireguard with_gvisor" -timeout 20m ./singbox/

  app:
    name: app (client build / vet / test / i18n / windows cross-build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install Gio Linux build dependencies
        # Gio's Linux desktop backend links Vulkan/X11/Wayland
        # headers; the Windows target below is CGO-free.
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev libx11-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcursor-dev libxfixes-dev \
            libxext-dev libwayland-dev libegl-dev libgles-dev
      - name: Build
        working-directory: app
        run: go build ./...
      - name: Vet
        working-directory: app
        run: go vet ./...
      - name: Vet (Windows target — type-checks the Windows platform files)
        working-directory: app
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: go vet ./...
      - name: Test
        working-directory: app
        # -checklinkname=0: app/libboxbind links libbox, whose
        # internals use //go:linkname into restricted runtime
        # symbols; test binaries do not link without the flag.
        # Upstream's own libbox ldflags carry the same flag
        # (docs/libbox绑定.md §6).
        run: go test -ldflags=-checklinkname=0 ./...
      - name: i18n gate (pack integrity + hardcoded-string scan, Step 9)
        working-directory: app
        run: go run ./tools/i18ncheck
      - name: Cross-build Windows client (official kernel build tags)
        working-directory: app
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: go build -tags "with_quic with_utls with_wireguard with_gvisor" -o dist/relavia.exe ./cmd/relavia
      - name: Upload Windows client artifact
        uses: actions/upload-artifact@v4
        with:
          name: relavia-windows-amd64
          path: app/dist/relavia.exe
          if-no-files-found: error

  android:
    name: android (cross-compile gate / libbox AAR / merged APK / gio logic APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: GOOS=android cross-compile gate (service / i18n / platform / bridge / libboxbind)
        run: ./scripts/build-android.sh check
      - name: Install gomobile (SagerNet fork, version pinned by sing-box v1.14.4's Makefile)
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.13
      - name: libbox binding AAR (gomobile bind, NDK from the runner image)
        run: |
          export ANDROID_NDK_HOME="$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)"
          export PATH="$HOME/go/bin:$PATH"
          ./scripts/build-android.sh bind
      - name: Upload libbox AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: relavia-android-libbox-aar
          path: android/app/libs/libboxbind.aar
          if-no-files-found: error
      - name: Merged APK — Kotlin shell + libbox AAR (Gradle assembleDebug)
        run: ./scripts/build-android.sh shell
      - name: Verify merged APK (native library present, permission set unchanged)
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK"
          unzip -l "$APK" | grep -E 'lib/(arm64-v8a|armeabi-v7a|x86_64)/libgojni\.so'
          AAPT2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          "$AAPT2" dump permissions "$APK"
          test "$("$AAPT2" dump permissions "$APK" | grep -c 'uses-permission:')" -eq 5
      - name: Upload merged APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: relavia-android-merged-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Install gogio
        run: go install gioui.org/cmd/gogio@v0.10.3
      - name: Gio logic-build APK (gogio, NDK from the runner image)
        run: |
          export ANDROID_NDK_HOME="$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)"
          export PATH="$HOME/go/bin:$PATH"
          ./scripts/build-android.sh gio
      - name: Upload Gio logic APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: relavia-android-logic
          path: app/dist/relavia-logic.apk
          if-no-files-found: error

  repro:
    name: repro (release tooling + reproducible builds, Step 15)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Release tool (build / vet / test)
        working-directory: tools/releasetool
        run: |
          go build ./...
          go vet ./...
          go test ./...
      - name: Install gomobile + gogio (versions pinned by the build scripts)
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.13
          go install gioui.org/cmd/gogio@v0.10.3
      - name: libbox AAR (shared input for the shell reproducibility check)
        run: |
          export ANDROID_NDK_HOME="$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)"
          export PATH="$HOME/go/bin:$PATH"
          ./scripts/build-android.sh bind
      - name: Reproducibility — windows (hard gate)
        run: ./scripts/release/repro-check.sh windows --report repro-windows.txt
      # shell/gio run evidence-first (continue-on-error): their
      # byte-reproducibility under Gradle/gogio+NDK has no CI track
      # record yet. The reports are uploaded either way; promote a
      # target to a hard gate only once it is green on evidence
      # (docs/step15-签名与可复现构建.md).
      - name: Reproducibility — android shell APK (evidence; not yet a gate)
        continue-on-error: true
        run: ./scripts/release/repro-check.sh shell --report repro-shell.txt
      - name: Reproducibility — gio logic APK (evidence; not yet a gate)
        continue-on-error: true
        run: |
          export ANDROID_NDK_HOME="$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)"
          export PATH="$HOME/go/bin:$PATH"
          ./scripts/release/repro-check.sh gio --report repro-gio.txt
      - name: Upload reproducibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relavia-repro-reports
          path: repro-*.txt
          if-no-files-found: warn

  plugins:
    name: plugins (source plugins build / vet / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build / vet / test (vpngate, Step 14)
        working-directory: plugins/vpngate
        run: |
          go build ./...
          go vet ./...
          go test ./...

  spec:
    name: spec (unified node model schema validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install jsonschema
        run: pip install "jsonschema>=4"
      - name: Validate schema and examples
        run: python3 spec/tests/validate.py

  openvpn-rig:
    name: openvpn (process adapter real-handshake rig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install OpenVPN (official distro package)
        run: |
          sudo apt-get update
          sudo apt-get install -y openvpn
          openvpn --version
      - name: Handshake rig (real server, TCP loopback, null device)
        working-directory: core
        env:
          RELAVIA_OPENVPN_RIG: "1"
        run: go test -run Rig -v -timeout 10m ./openvpn/
