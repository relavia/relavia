# AndroidX is required: the shell depends on androidx.core:core-ktx.
# Without this flag AGP aborts at :app:checkDebugAarMetadata
# (first surfaced by CI run 43287155580, Step 10's android job —
# the sandbox cannot run Gradle, so local builds never saw it).
android.useAndroidX=true
# :app:packageDebug died with OutOfMemoryError in the incremental
# splitter once the merged APK grew past ~230 MB (CI run 43481827951,
# db97b5b: the AAR now also carries the Gio product UI). The Gradle
# daemon's default heap (~512 MB) cannot split a four-ABI package of
# this size; give it real headroom (GitHub runners have ~7 GB).
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
